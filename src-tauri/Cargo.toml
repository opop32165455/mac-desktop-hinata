[package]
name = "purple-moment"
version = "1.0.1"
edition = "2021"

[lib]
name = "purple_moment_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
objc2 = "0.5"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
